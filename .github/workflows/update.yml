name: update
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    env:
      VENDOR_DIR: orekit/orekit-data
    steps:
      - uses: actions/checkout@v4

      - name: Update data
        working-directory: ${{ env.VENDOR_DIR }}
        run: ./update.sh

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$VENDOR_DIR"
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "data: update $VENDOR_DIR via update.sh ($(date -u +%Y-%m-%d))"
          git push
